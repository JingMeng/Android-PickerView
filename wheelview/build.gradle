apply plugin: 'com.android.library'
//apply plugin: 'com.novoda.bintray-release'//??????



android {
    namespace 'com.contrarywind.view'
    compileSdk 34

    defaultConfig {
        minSdk 14
        targetSdk 34
        versionCode 31
        versionName "4.1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
    lintOptions {
        abortOnError false
    }
}

